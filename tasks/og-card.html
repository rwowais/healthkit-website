<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:#F6F7F9;position:relative}
  /* The day arc — "diurna" means daily. A sun crossing a horizon, drawn as
     one calm stroke. Sits behind the type, never competing with it. */
  .arc{position:absolute;right:-120px;top:-160px;width:820px;height:820px;
    border-radius:50%;border:1.5px solid rgba(75,87,206,.16)}
  .arc2{position:absolute;right:-40px;top:-60px;width:620px;height:620px;
    border-radius:50%;border:1.5px solid rgba(75,87,206,.10)}
  .sun{position:absolute;right:196px;top:150px;width:132px;height:132px;border-radius:50%;
    background:linear-gradient(145deg,#8E9CF7,#6FA8F5);
    box-shadow:0 24px 70px rgba(75,87,206,.28)}
  .wrap{position:relative;padding:82px 96px;height:100%;display:flex;
    flex-direction:column;justify-content:space-between}
  .mark{display:flex;align-items:center;gap:16px}
  .glyph{width:52px;height:52px;border-radius:16px;
    background:linear-gradient(145deg,#8E9CF7,#6FA8F5);
    display:grid;place-items:center}
  .glyph i{width:15px;height:15px;border-radius:50%;background:#F6F7F9;display:block}
  .name{font-size:27px;font-weight:700;letter-spacing:-.02em;color:#13161B}
  h1{font-size:74px;line-height:1.06;font-weight:700;letter-spacing:-.035em;
    color:#13161B;max-width:15ch}
  h1 span{color:#4B57CE}
  p{margin-top:24px;font-size:26px;line-height:1.5;color:#474D57;max-width:30ch}
  .foot{font-size:21px;font-weight:600;color:#626873;letter-spacing:-.01em}
</style></head><body>
  <div class="arc"></div><div class="arc2"></div><div class="sun"></div>
  <div class="wrap">
    <div class="mark"><span class="glyph"><i></i></span><span class="name">Diurna Health</span></div>
    <div>
      <h1>Your adaptive <span>daily</span> protocol.</h1>
      <p>Sleep, training, nutrition and supplements — one day that reshapes itself around your recovery.</p>
    </div>
    <div class="foot">diurnahealth.com</div>
  </div>
</body></html>
